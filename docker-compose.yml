# Managarr + PostgreSQL. Works as-is (`docker compose up -d --build`); to
# configure, `cp .env.example .env` and edit. All settings live in .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-managarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-managarr}
      POSTGRES_DB: ${POSTGRES_DB:-managarr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  managarr:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Compose wiring; these override .env so the app always finds the bundled DB.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-managarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-managarr}
      POSTGRES_DB: ${POSTGRES_DB:-managarr}
      CONFIG_DIR: /config
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MANAGARR_PORT:-8000}:8000"
    volumes:
      - ${CONFIG_DIR_HOST:-./data/config}:/config
      - ${MOVIES_DIR:-./data/movies}:/movies
      - ${NEW_MOVIES_DIR:-./data/new-movies}:/new-movies
      - ${TV_DIR:-./data/tv}:/tv
      - ${AUDIOBOOKS_DIR:-./data/audiobooks}:/audiobooks
      - ${DOWNLOADS_DIR:-./data/downloads}:/downloads
      - ${LIBATION_DIR:-./data/libation}:/db
    restart: unless-stopped

volumes:
  pgdata:
